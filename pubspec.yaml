name: qalamkaarpro
description: Professional Urdu Designer App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  pdf: ^3.11.0
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: JameelNoori
      fonts:
        - asset: assets/jameel.ttf
