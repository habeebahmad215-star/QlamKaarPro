name: qalamkaarpro
description: Professional Urdu Designer App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  pdf: ^3.11.0
  printing: ^5.12.0
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  
  # 🔥 PATH ERROR FIXED
  fonts:
    - family: JameelNoori
      fonts:
        - asset: jameel-noori-nastaleeq.ttf

    - family: AlMajeed
      fonts:
        - asset: Al Majeed Quranic Font_shiped.ttf

    - family: AlviNastaleeq
      fonts:
        - asset: Alvi Nastaleeq Regular.ttf

    - family: Mehr
      fonts:
        - asset: Mehr_Nastaliq_Web v. 2.0.ttf

    - family: BombayBlack
      fonts:
        - asset: Bombay Black.ttf
