name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Save code and prepare Jameel font
        run: |
          mkdir -p /tmp/user_code/assets
          cp -r lib /tmp/user_code/
          cp pubspec.yaml /tmp/user_code/
          # Zip ko un-zip karo aur .ttf file dhoondh kar asaan naam de do
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d /tmp/fonts/
            fi
          done
          # Kisi bhi font file ko dhoondh kar jameel.ttf bana do
          find /tmp/fonts -type f -iname "*.ttf" -exec cp {} /tmp/user_code/assets/jameel.ttf \;

      - name: Create fresh Flutter project
        run: flutter create . --org com.qalamkaar.pro --project-name qalamkaarpro --platforms=android

      - name: Restore user code and font
        run: |
          rm -rf lib
          cp -r /tmp/user_code/lib .
          cp /tmp/user_code/pubspec.yaml .
          cp -r /tmp/user_code/assets .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QalamKaarPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
