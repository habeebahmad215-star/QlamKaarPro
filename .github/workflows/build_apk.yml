name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare Assets and Fonts
        run: |
          mkdir -p assets
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d /tmp/fonts/ || true
            fi
          done
          if [ -d "/tmp/fonts" ]; then
            find /tmp/fonts -type f -iname "*.ttf" -exec cp {} assets/jameel.ttf \; -quit || true
          fi

      - name: Configure Android Build Settings
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.qalamkaar.pro --project-name qalamkaarpro --platforms=android
          fi
          
          # 🔥 YAHAN INTERNET PERMISSION AUTOMATICALLY ADD HO JAYEGI 🔥
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          
          # Ensure compileSdkVersion and targetSdkVersion are compatible
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/g' android/app/build.gradle || true
          
          # Enable MultiDex
          if ! grep -q "multiDexEnabled true" android/app/build.gradle; then
            sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK for Testing
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AAB for Play Store
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QalamKaarPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: QalamKaarPro-AAB
          path: build/app/outputs/bundle/release/app-release.aab
