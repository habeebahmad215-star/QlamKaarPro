name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Save user files temporarily
        run: |
          mkdir -p /tmp/user_code
          cp -r lib /tmp/user_code/
          cp pubspec.yaml /tmp/user_code/
          mkdir -p assets
          # Unzip any zip file found in root
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d assets/
            fi
          done
          # Copy extracted assets to temp
          if [ -d "assets" ]; then
            cp -r assets /tmp/user_code/
          fi

      - name: Create fresh Flutter project
        run: |
          flutter create . --org com.qalamkaar.pro --project-name qalamkaarpro --platforms=android

      - name: Restore user code and assets into fresh project
        run: |
          rm -rf lib
          cp -r /tmp/user_code/lib .
          cp /tmp/user_code/pubspec.yaml .
          mkdir -p assets
          if [ -d "/tmp/user_code/assets" ]; then
            cp -r /tmp/user_code/assets/* assets/ 2>/dev/null || true
          fi
          # List files in assets to verify during build logs
          echo "Files inside assets folder:"
          ls -la assets/

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QalamKaarPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
